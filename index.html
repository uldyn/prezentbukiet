<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ascii_player.py — Bukiet Lilii 3D ASCII</title>
  <style>
    :root {
      --bg: #050507;
      --panel-bg: #111216;
      --panel-border: #252830;
      --text-main: #d4d7df;
      --text-muted: #7f8594;
      --accent: #ff6b9d;
      --accent-soft: rgba(255, 107, 157, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Górny pasek okna w stylu terminala / edytora z pierwszego zdjęcia */
    .window-bar {
      background: #16181e;
      border-bottom: 1px solid var(--panel-border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .window-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .traffic-lights {
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .window-title {
      font-size: 13px;
      color: #a9b1c3;
      letter-spacing: 0.3px;
    }

    .window-title span {
      color: var(--accent);
    }

    .hint-badge {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--panel-border);
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* Główny obszar renderowania ASCII */
    .viewport {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0e0a0d 0%, #040406 75%);
      overflow: hidden;
      cursor: grab;
    }

    .viewport:active {
      cursor: grabbing;
    }

    #asciiCanvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    /* Dolny panel sterowania */
    .controls {
      background: var(--panel-bg);
      border-top: 1px solid var(--panel-border);
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-shrink: 0;
      font-size: 12px;
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .slider-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }

    .slider-item strong {
      color: var(--text-main);
      min-width: 36px;
      text-align: right;
      font-weight: 600;
    }

    input[type="range"] {
      accent-color: var(--accent);
      width: 95px;
      cursor: pointer;
    }

    button, .file-btn {
      background: #1b1e26;
      color: var(--text-main);
      border: 1px solid #2e3340;
      padding: 7px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover, .file-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #fff;
    }

    button.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #ff9ec0;
    }

    #imageInput {
      display: none;
    }

    @media (max-width: 768px) {
      .hint-badge { display: none; }
      .controls { padding: 10px 12px; gap: 10px; }
      input[type="range"] { width: 75px; }
    }
  </style>
</head>
<body>

  <header class="window-bar">
    <div class="window-left">
      <div class="traffic-lights">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <div class="window-title">
        ascii_player.py — <span>Renderer.convert() + draw()</span> [3D Lilies]
      </div>
    </div>
    <div class="hint-badge">Przeciągnij myszką lub palcem, aby obrócić 360°</div>
  </header>

  <main class="viewport" id="viewport">
    <canvas id="asciiCanvas"></canvas>
  </main>

  <footer class="controls">
    <div class="control-group">
      <button id="toggleRotateBtn" class="active">⏸ Pauza obrotu</button>

      <label class="slider-item">
        Prędkość
        <input type="range" id="speedSlider" min="-2.5" max="2.5" step="0.1" value="0.7" />
        <strong id="speedVal">0.7x</strong>
      </label>

      <label class="slider-item">
        Kolumny
        <input type="range" id="colsSlider" min="65" max="190" step="5" value="125" />
        <strong id="colsVal">125</strong>
      </label>

      <label class="slider-item">
        Krawędzie
        <input type="range" id="edgesSlider" min="0" max="1" step="0.05" value="0.55" />
        <strong id="edgesVal">0.55</strong>
      </label>

      <label class="slider-item">
        Nasycenie
        <input type="range" id="satSlider" min="0.5" max="2.2" step="0.1" value="1.35" />
        <strong id="satVal">1.35</strong>
      </label>
    </div>

    <div class="control-group">
      <button id="blocksBtn">▀ Bloki: WYŁ</button>
      <label class="file-btn" for="imageInput">📷 Wgraj zdjęcie</label>
      <input type="file" id="imageInput" accept="image/*" />
      <button id="resetBouquetBtn" style="display:none;">🌸 Wróć do lilii 3D</button>
      <button id="savePngBtn">💾 Zapisz PNG</button>
    </div>
  </footer>

  <script>
    // =========================================================================
    // KONFIGURACJA SILNIKA (wzorowana na ascii_player.py)
    // =========================================================================
    const RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

    const state = {
      cols: 125,
      edges: 0.55,
      saturation: 1.35,
      useBlocks: false,
      autoRotate: true,
      rotateSpeed: 0.7,
      angleY: 0.25,
      tiltX: 0.14,
      isDragging: false,
      lastPointerX: 0,
      lastPointerY: 0,
      customImage: null,
      time: 0
    };

    const asciiCanvas = document.getElementById("asciiCanvas");
    const asciiCtx = asciiCanvas.getContext("2d");

    // Ukryty bufor 3D/2D do rasteryzacji sceny przed konwersją na ASCII
    const srcCanvas = document.createElement("canvas");
    const srcCtx = srcCanvas.getContext("2d", { willReadFrequently: true });

    // =========================================================================
    // BUDOWA TRÓJWYMIAROWEGO BUKIETU LILII ORIENTALNYCH W WAZONIE
    // =========================================================================
    function createBouquet3D() {
      const flowers = [];
      const leaves = [];
      const buds = [];

      // 12 rozkwitłych kwiatów lilii rozmieszczonych przestrzennie w 3D
      const flowerConfigs = [
        // Główne przednie i środkowe kwiaty
        { x: 0.0,   y: 52,  z: 48,  rx: -0.35, ry: 0.05,  rz: 0.0,   scale: 1.15 },
        { x: -46,   y: 38,  z: 36,  rx: -0.25, ry: -0.55, rz: 0.28,  scale: 1.12 },
        { x: 48,    y: 44,  z: 34,  rx: -0.28, ry: 0.55,  rz: -0.25, scale: 1.10 },
        { x: -24,   y: 82,  z: 18,  rx: -0.52, ry: -0.25, rz: 0.12,  scale: 1.05 },
        { x: 26,    y: 85,  z: 15,  rx: -0.55, ry: 0.28,  rz: -0.15, scale: 1.06 },
        // Boczne i tylne kwiaty zapewniające pełne 360°
        { x: -62,   y: 55,  z: -10, rx: -0.22, ry: -1.35, rz: 0.2,   scale: 1.02 },
        { x: 64,    y: 58,  z: -8,  rx: -0.20, ry: 1.38,  rz: -0.2,  scale: 1.04 },
        { x: -42,   y: 46,  z: -44, rx: -0.28, ry: -2.45, rz: 0.18,  scale: 1.08 },
        { x: 40,    y: 48,  z: -45, rx: -0.30, ry: 2.42,  rz: -0.18, scale: 1.08 },
        { x: 0,     y: 62,  z: -52, rx: -0.35, ry: 3.10,  rz: 0.05,  scale: 1.12 },
        { x: 0,     y: 105, z: -8,  rx: -0.78, ry: 0.4,   rz: 0.0,   scale: 0.96 },
        { x: -16,   y: 22,  z: 52,  rx: -0.10, ry: -0.18, rz: 0.08,  scale: 1.04 }
      ];

      flowerConfigs.forEach((cfg, idx) => {
        flowers.push({
          ...cfg,
          phase: idx * 0.85,
          stemBaseX: cfg.x * 0.22,
          stemBaseZ: cfg.z * 0.22
        });
      });

      // Pąki u góry bukietu
      buds.push(
        { x: 14, y: 126, z: -18, rx: -0.15, ry: 0.3, rz: -0.22, scale: 0.9 },
        { x: -22, y: 118, z: -24, rx: 0.1, ry: -0.5, rz: 0.26, scale: 0.85 },
        { x: 8, y: 122, z: 22, rx: -0.2, ry: 0.1, rz: -0.12, scale: 0.82 }
      );

      // 18 ciemnozielonych liści wokół szyjki wazonu
      for (let i = 0; i < 18; i++) {
        const theta = (i / 18) * Math.PI * 2;
        const r = 18 + (i % 3) * 8;
        leaves.push({
          x: Math.cos(theta) * r,
          y: 8 + (i % 4) * 14,
          z: Math.sin(theta) * r,
          yaw: theta,
          pitch: 0.45 + (i % 3) * 0.22,
          length: 48 + (i % 3) * 12,
          width: 11 + (i % 2) * 3,
          phase: i * 0.6
        });
      }

      return { flowers, leaves, buds };
    }

    const bouquet = createBouquet3D();

    // Obrót punktu 3D wokół osi Y (obrót bukietu) i lekkie pochylenie X
    function project3D(x, y, z, angleY, tiltX, cx, cy, scale) {
      // Obrót Y
      const cosY = Math.cos(angleY);
      const sinY = Math.sin(angleY);
      const x1 = x * cosY - z * sinY;
      const z1 = x * sinY + z * cosY;

      // Pochylenie X
      const cosX = Math.cos(tiltX);
      const sinX = Math.sin(tiltX);
      const y2 = y * cosX - z1 * sinX;
      const z2 = y * sinX + z1 * cosX;

      // Rzut perspektywiczny
      const fov = 420;
      const perspective = fov / (fov + z2 + 120);
      return {
        x: cx + x1 * perspective * scale,
        y: cy - y2 * perspective * scale,
        z: z2,
        p: perspective * scale
      };
    }

    // Lokalna transformacja punktu płatka względem środka kwiatu
    function transformLocal(lx, ly, lz, flower) {
      // Obrót Z
      let x = lx * Math.cos(flower.rz) - ly * Math.sin(flower.rz);
      let y = lx * Math.sin(flower.rz) + ly * Math.cos(flower.rz);
      let z = lz;

      // Obrót X
      let y1 = y * Math.cos(flower.rx) - z * Math.sin(flower.rx);
      let z1 = y * Math.sin(flower.rx) + z * Math.cos(flower.rx);
      y = y1;
      z = z1;

      // Obrót Y
      let x2 = x * Math.cos(flower.ry) - z * Math.sin(flower.ry);
      let z2 = x * Math.sin(flower.ry) + z * Math.cos(flower.ry);

      return {
        x: flower.x + x2 * flower.scale,
        y: flower.y + y * flower.scale,
        z: flower.z + z2 * flower.scale
      };
    }

    // =========================================================================
    // RENDEROWANIE SCENY 3D NA UKRYTYM CANVASIE
    // =========================================================================
    function renderScene3D(width, height) {
      srcCanvas.width = width;
      srcCanvas.height = height;

      // Głębokie ciemne tło, które ascii_player.py odcina jako pustą przestrzeń
      srcCtx.fillStyle = "#030305";
      srcCtx.fillRect(0, 0, width, height);

      const cx = width * 0.5;
      const cy = height * 0.56;
      const sceneScale = Math.min(width, height) / 290;
      const sway = Math.sin(state.time * 1.4) * 0.03;

      const drawables = [];

      // 1. Prążkowany szklany wazon (cylindryczne pionowe żebra 3D)
      const vaseTopY = -12;
      const vaseBotY = -112;
      const vaseRadTop = 28;
      const vaseRadBot = 24;
      const ribs = 26;

      for (let i = 0; i < ribs; i++) {
        const a1 = (i / ribs) * Math.PI * 2;
        const a2 = ((i + 0.72) / ribs) * Math.PI * 2;

        const pTop1 = project3D(Math.cos(a1) * vaseRadTop, vaseTopY, Math.sin(a1) * vaseRadTop, state.angleY, state.tiltX, cx, cy, sceneScale);
        const pTop2 = project3D(Math.cos(a2) * vaseRadTop, vaseTopY, Math.sin(a2) * vaseRadTop, state.angleY, state.tiltX, cx, cy, sceneScale);
        const pBot2 = project3D(Math.cos(a2) * vaseRadBot, vaseBotY, Math.sin(a2) * vaseRadBot, state.angleY, state.tiltX, cx, cy, sceneScale);
        const pBot1 = project3D(Math.cos(a1) * vaseRadBot, vaseBotY, Math.sin(a1) * vaseRadBot, state.angleY, state.tiltX, cx, cy, sceneScale);

        const avgZ = (pTop1.z + pTop2.z + pBot1.z + pBot2.z) * 0.25;
        const isFront = avgZ < 0;

        drawables.push({
          z: avgZ + (isFront ? 5 : 40),
          draw: () => {
            srcCtx.beginPath();
            srcCtx.moveTo(pTop1.x, pTop1.y);
            srcCtx.lineTo(pTop2.x, pTop2.y);
            srcCtx.lineTo(pBot2.x, pBot2.y);
            srcCtx.lineTo(pBot1.x, pBot1.y);
            srcCtx.closePath();

            const highlight = Math.abs(Math.sin(a1 + state.angleY));
            const alpha = isFront ? 0.28 + highlight * 0.28 : 0.14;
            srcCtx.fillStyle = `rgba(145, 175, 165, ${alpha})`;
            srcCtx.fill();

            srcCtx.strokeStyle = isFront
              ? `rgba(215, 240, 232, ${0.35 + highlight * 0.45})`
              : "rgba(95, 120, 112, 0.22)";
            srcCtx.lineWidth = Math.max(1, 1.2 * pTop1.p);
            srcCtx.stroke();
          }
        });
      }

      // 2. Łodygi wewnątrz i ponad wazonem
      bouquet.flowers.forEach((fl) => {
        const pTop = project3D(fl.x, fl.y - 6, fl.z, state.angleY + sway, state.tiltX, cx, cy, sceneScale);
        const pMid = project3D(fl.stemBaseX, 4, fl.stemBaseZ, state.angleY, state.tiltX, cx, cy, sceneScale);
        const pBot = project3D(fl.stemBaseX * 0.7, -96, fl.stemBaseZ * 0.7, state.angleY, state.tiltX, cx, cy, sceneScale);

        drawables.push({
          z: (pTop.z + pMid.z + pBot.z) / 3 + 12,
          draw: () => {
            srcCtx.beginPath();
            srcCtx.moveTo(pBot.x, pBot.y);
            srcCtx.quadraticCurveTo(pMid.x, pMid.y, pTop.x, pTop.y);
            srcCtx.strokeStyle = "#2b4d27";
            srcCtx.lineWidth = Math.max(2, 3.6 * pMid.p);
            srcCtx.stroke();
          }
        });
      });

      // 3. Ciemnozielone liście
      bouquet.leaves.forEach((lf) => {
        const wYaw = lf.yaw + Math.sin(state.time * 1.6 + lf.phase) * 0.05;
        const pBase = project3D(lf.x, lf.y, lf.z, state.angleY, state.tiltX, cx, cy, sceneScale);

        const tipX = lf.x + Math.cos(wYaw) * lf.length;
        const tipY = lf.y + Math.sin(lf.pitch) * lf.length * 0.45 - 8;
        const tipZ = lf.z + Math.sin(wYaw) * lf.length;
        const pTip = project3D(tipX, tipY, tipZ, state.angleY, state.tiltX, cx, cy, sceneScale);

        const perpX = -Math.sin(wYaw) * lf.width;
        const perpZ = Math.cos(wYaw) * lf.width;
        const midX = (lf.x + tipX) * 0.5;
        const midY = (lf.y + tipY) * 0.5 + 8;
        const midZ = (lf.z + tipZ) * 0.5;

        const pLeft = project3D(midX + perpX, midY, midZ + perpZ, state.angleY, state.tiltX, cx, cy, sceneScale);
        const pRight = project3D(midX - perpX, midY, midZ - perpZ, state.angleY, state.tiltX, cx, cy, sceneScale);

        drawables.push({
          z: (pBase.z + pTip.z + pLeft.z + pRight.z) * 0.25,
          draw: () => {
            srcCtx.beginPath();
            srcCtx.moveTo(pBase.x, pBase.y);
            srcCtx.quadraticCurveTo(pLeft.x, pLeft.y, pTip.x, pTip.y);
            srcCtx.quadraticCurveTo(pRight.x, pRight.y, pBase.x, pBase.y);
            srcCtx.closePath();

            const grad = srcCtx.createLinearGradient(pBase.x, pBase.y, pTip.x, pTip.y);
            grad.addColorStop(0, "#172e16");
            grad.addColorStop(0.6, "#284b24");
            grad.addColorStop(1, "#396432");
            srcCtx.fillStyle = grad;
            srcCtx.fill();
          }
        });
      });

      // 4. Pąki lilii (kremowo-różowe zamknięte kielichy)
      bouquet.buds.forEach((bud) => {
        const pBase = project3D(bud.x, bud.y - 14, bud.z, state.angleY + sway, state.tiltX, cx, cy, sceneScale);
        const pTip = project3D(bud.x + 4, bud.y + 18, bud.z, state.angleY + sway, state.tiltX, cx, cy, sceneScale);
        const pL = project3D(bud.x - 6, bud.y + 2, bud.z + 4, state.angleY + sway, state.tiltX, cx, cy, sceneScale);
        const pR = project3D(bud.x + 8, bud.y + 2, bud.z - 4, state.angleY + sway, state.tiltX, cx, cy, sceneScale);

        drawables.push({
          z: pTip.z,
          draw: () => {
            srcCtx.beginPath();
            srcCtx.moveTo(pBase.x, pBase.y);
            srcCtx.quadraticCurveTo(pL.x, pL.y, pTip.x, pTip.y);
            srcCtx.quadraticCurveTo(pR.x, pR.y, pBase.x, pBase.y);
            srcCtx.closePath();
            const g = srcCtx.createLinearGradient(pBase.x, pBase.y, pTip.x, pTip.y);
            g.addColorStop(0, "#6e8b48");
            g.addColorStop(0.45, "#f7dbe2");
            g.addColorStop(1, "#f2a6be");
            srcCtx.fillStyle = g;
            srcCtx.fill();
          }
        });
      });

      // 5. Rozkwitłe kwiaty lilii orientalnych (6 płatków + 6 pręcików każdy)
      bouquet.flowers.forEach((fl) => {
        const fSway = Math.sin(state.time * 1.5 + fl.phase) * 0.035;
        const centerWorld = transformLocal(0, 0, 0, fl);
        const pCenter = project3D(centerWorld.x, centerWorld.y, centerWorld.z, state.angleY + fSway, state.tiltX, cx, cy, sceneScale);

        // 6 płatków ułożonych promieniście w dwóch warstwach (zewnętrzna i wewnętrzna)
        for (let p = 0; p < 6; p++) {
          const theta = (p / 6) * Math.PI * 2 + (p % 2) * 0.06;
          const petalLen = p % 2 === 0 ? 34 : 31;
          const petalWid = p % 2 === 0 ? 11.5 : 13.0;
          const curlBack = -9.5; // Charakterystyczne wywinięcie płatków lilii do tyłu

          const cosT = Math.cos(theta);
          const sinT = Math.sin(theta);

          // Punkty płatka w lokalnym układzie kwiatu
          const lBase = transformLocal(cosT * 3, sinT * 3, 1, fl);
          const lMidL = transformLocal(
            cosT * (petalLen * 0.52) - sinT * petalWid,
            sinT * (petalLen * 0.52) + cosT * petalWid,
            4.5,
            fl
          );
          const lMidR = transformLocal(
            cosT * (petalLen * 0.52) + sinT * petalWid,
            sinT * (petalLen * 0.52) - cosT * petalWid,
            4.5,
            fl
          );
          const lTip = transformLocal(
            cosT * petalLen,
            sinT * petalLen,
            curlBack,
            fl
          );
          const lStripeEnd = transformLocal(
            cosT * (petalLen * 0.76),
            sinT * (petalLen * 0.76),
            -2.0,
            fl
          );

          const pBase = project3D(lBase.x, lBase.y, lBase.z, state.angleY + fSway, state.tiltX, cx, cy, sceneScale);
          const pMidL = project3D(lMidL.x, lMidL.y, lMidL.z, state.angleY + fSway, state.tiltX, cx, cy, sceneScale);
          const pMidR = project3D(lMidR.x, lMidR.y, lMidR.z, state.angleY + fSway, state.tiltX, cx, cy, sceneScale);
          const pTip = project3D(lTip.x, lTip.y, lTip.z, state.angleY + fSway, state.tiltX, cx, cy, sceneScale);
          const pStripe = project3D(lStripeEnd.x, lStripeEnd.y, lStripeEnd.z, state.angleY + fSway, state.tiltX, cx, cy, sceneScale);

          const petalZ = (pBase.z + pMidL.z + pMidR.z + pTip.z) * 0.25;

          drawables.push({
            z: petalZ,
            draw: () => {
              // Kształt płatka lilii z jasnym, lekko falowanym brzegiem
              srcCtx.beginPath();
              srcCtx.moveTo(pBase.x, pBase.y);
              srcCtx.quadraticCurveTo(pMidL.x, pMidL.y, pTip.x, pTip.y);
              srcCtx.quadraticCurveTo(pMidR.x, pMidR.y, pBase.x, pBase.y);
              srcCtx.closePath();

              // Gradient od zielonkawo-kremowego gardła przez intensywny róż po biały brzeg
              const grad = srcCtx.createLinearGradient(pBase.x, pBase.y, pTip.x, pTip.y);
              grad.addColorStop(0.0, "#b9c46a");
              grad.addColorStop(0.18, "#d4336a");
              grad.addColorStop(0.62, "#f47aa3");
              grad.addColorStop(0.88, "#ffdbe7");
              grad.addColorStop(1.0, "#fff4f8");

              srcCtx.fillStyle = grad;
              srcCtx.fill();

              // Jasna obwódka płatka wzmacniająca detekcję krawędzi Sobela
              srcCtx.strokeStyle = "rgba(255, 232, 240, 0.72)";
              srcCtx.lineWidth = Math.max(0.8, 1.1 * pBase.p);
              srcCtx.stroke();

              // Ciemnoróżowa pręga środkowa i cętki (papillae)
              srcCtx.beginPath();
              srcCtx.moveTo(pBase.x, pBase.y);
              srcCtx.lineTo(pStripe.x, pStripe.y);
              srcCtx.strokeStyle = "rgba(176, 22, 74, 0.78)";
              srcCtx.lineWidth = Math.max(1.2, 2.2 * pBase.p);
              srcCtx.stroke();

              // Charakterystyczne bordowe kropki wewnątrz płatka
              for (let s = 1; s <= 4; s++) {
                const t = s * 0.14;
                const sx = pBase.x + (pStripe.x - pBase.x) * t;
                const sy = pBase.y + (pStripe.y - pBase.y) * t;
                const off = (s % 2 === 0 ? 1 : -1) * 2.2 * pBase.p;
                srcCtx.fillStyle = "#6e0d2e";
                srcCtx.fillRect(sx + off, sy - off * 0.5, 1.6 * pBase.p, 1.6 * pBase.p);
              }
            }
          });
        }

        // 6 długich pręcików z ciemnobrązowymi pylnikami wystającymi ze środka
        for (let st = 0; st < 6; st++) {
          const a = (st / 6) * Math.PI * 2 + 0.3;
          const lAnther = transformLocal(Math.cos(a) * 11, Math.sin(a) * 11, 16, fl);
          const pAnther = project3D(lAnther.x, lAnther.y, lAnther.z, state.angleY + fSway, state.tiltX, cx, cy, sceneScale);

          drawables.push({
            z: pAnther.z - 2,
            draw: () => {
              srcCtx.beginPath();
              srcCtx.moveTo(pCenter.x, pCenter.y);
              srcCtx.lineTo(pAnther.x, pAnther.y);
              srcCtx.strokeStyle = "#d9e39a";
              srcCtx.lineWidth = Math.max(0.9, 1.2 * pCenter.p);
              srcCtx.stroke();

              // Pylnik (anther)
              srcCtx.fillStyle = "#591818";
              srcCtx.beginPath();
              srcCtx.ellipse(
                pAnther.x,
                pAnther.y,
                Math.max(1.8, 3.0 * pAnther.p),
                Math.max(1.0, 1.5 * pAnther.p),
                a,
                0,
                Math.PI * 2
              );
              srcCtx.fill();
            }
          });
        }
      });

      // Sortowanie od najdalszych (największe Z) do najbliższych (najmniejsze Z)
      drawables.sort((a, b) => b.z - a.z);
      for (let i = 0; i < drawables.length; i++) {
        drawables[i].draw();
      }
    }

    // Rysowanie wgranego zdjęcia użytkownika z zachowaniem proporcji na czarnym tle
    function renderCustomImage(width, height) {
      srcCanvas.width = width;
      srcCanvas.height = height;
      srcCtx.fillStyle = "#030305";
      srcCtx.fillRect(0, 0, width, height);

      const img = state.customImage;
      const scale = Math.min(width / img.width, height / img.height);
      const dw = img.width * scale;
      const dh = img.height * scale;
      const dx = (width - dw) * 0.5;
      const dy = (height - dh) * 0.5;
      srcCtx.drawImage(img, dx, dy, dw, dh);
    }

    // =========================================================================
    // SILNIK KONWERSJI ASCII (dokładna logika z ascii_player.py)
    // =========================================================================
    function adjustSaturation(r, g, b, sat) {
      if (sat === 1.0) return [r, g, b];
      // Konwersja RGB -> HSV -> modyfikacja S -> RGB (jak w cv2.COLOR_BGR2HSV)
      const rn = r / 255, gn = g / 255, bn = b / 255;
      const max = Math.max(rn, gn, bn);
      const min = Math.min(rn, gn, bn);
      const d = max - min;
      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (d !== 0) {
        if (max === rn) h = ((gn - bn) / d + (gn < bn ? 6 : 0)) / 6;
        else if (max === gn) h = ((bn - rn) / d + 2) / 6;
        else h = ((rn - gn) / d + 4) / 6;
      }

      const sNew = Math.min(1, Math.max(0, s * sat));
      const i = Math.floor(h * 6);
      const f = h * 6 - i;
      const p = v * (1 - sNew);
      const q = v * (1 - f * sNew);
      const t = v * (1 - (1 - f) * sNew);

      let ro, go, bo;
      switch (i % 6) {
        case 0: ro = v; go = t; bo = p; break;
        case 1: ro = q; go = v; bo = p; break;
        case 2: ro = p; go = v; bo = t; break;
        case 3: ro = p; go = q; bo = v; break;
        case 4: ro = t; go = p; bo = v; break;
        case 5: ro = v; go = p; bo = q; break;
      }
      return [Math.round(ro * 255), Math.round(go * 255), Math.round(bo * 255)];
    }

    function convertAndDrawASCII() {
      const viewport = document.getElementById("viewport");
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight;

      const cols = state.cols;
      // Proporcje znaku terminala (~0.52 szerokości do wysokości)
      const charAspect = 0.52;
      const cellW = Math.max(5, Math.floor((vw - 24) / cols));
      const cellH = Math.max(9, Math.round(cellW / charAspect));
      const rows = Math.max(20, Math.floor((vh - 16) / cellH));

      const sampleRows = state.useBlocks ? rows * 2 : rows;

      if (state.customImage) {
        renderCustomImage(cols, sampleRows);
      } else {
        renderScene3D(cols, sampleRows);
      }

      const imgData = srcCtx.getImageData(0, 0, cols, sampleRows).data;
      const totalPixels = cols * sampleRows;
      const rArr = new Uint8Array(totalPixels);
      const gArr = new Uint8Array(totalPixels);
      const bArr = new Uint8Array(totalPixels);
      const lum = new Float32Array(totalPixels);

      for (let i = 0; i < totalPixels; i++) {
        const p = i * 4;
        const [r, g, b] = adjustSaturation(imgData[p], imgData[p + 1], imgData[p + 2], state.saturation);
        rArr[i] = r;
        gArr[i] = g;
        bArr[i] = b;
        // lum = (0.299 * rgb[..., 0] + 0.587 * rgb[..., 1] + 0.114 * rgb[..., 2]) / 255.0
        lum[i] = (0.299 * r + 0.587 * g + 0.114 * b) / 255.0;
      }

      // Przygotowanie docelowego canvasu ASCII
      const outW = cols * cellW;
      const outH = rows * cellH;
      if (asciiCanvas.width !== outW || asciiCanvas.height !== outH) {
        asciiCanvas.width = outW;
        asciiCanvas.height = outH;
      }

      asciiCtx.fillStyle = "#040406";
      asciiCtx.fillRect(0, 0, outW, outH);

      // Tryb półbloków ("▀") z ascii_player.py
      if (state.useBlocks) {
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const topIdx = (r * 2) * cols + c;
            const botIdx = (r * 2 + 1) * cols + c;

            if (lum[topIdx] >= 0.06) {
              asciiCtx.fillStyle = `rgb(${rArr[topIdx]},${gArr[topIdx]},${bArr[topIdx]})`;
              asciiCtx.fillRect(c * cellW, r * cellH, cellW, Math.ceil(cellH / 2));
            }
            if (lum[botIdx] >= 0.06) {
              asciiCtx.fillStyle = `rgb(${rArr[botIdx]},${gArr[botIdx]},${bArr[botIdx]})`;
              asciiCtx.fillRect(c * cellW, r * cellH + Math.floor(cellH / 2), cellW, Math.ceil(cellH / 2));
            }
          }
        }
        return;
      }

      // Standardowy tryb znakowy + operator Sobela z ascii_player.py
      const edgeGlyphs = ["-", "\\", "|", "/"];
      const edgeThresh = 0.8 - 0.6 * state.edges;
      const rampLen = RAMP.length;

      asciiCtx.font = `bold ${cellH}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
      asciiCtx.textBaseline = "top";

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const idx = r * cols + c;
          const l = lum[idx];

          // idx[lum < 0.06] = 0 -> czarne tło pozostaje puste
          if (l < 0.06) continue;

          let chIdx = Math.min(rampLen - 1, Math.max(0, Math.round(l * (rampLen - 1))));
          let glyph = RAMP[chIdx];

          // Detekcja krawędzi Sobela (gx, gy, mag, ang)
          if (state.edges > 0 && r > 0 && r < rows - 1 && c > 0 && c < cols - 1) {
            const tl = lum[(r - 1) * cols + (c - 1)];
            const tc = lum[(r - 1) * cols + c];
            const tr = lum[(r - 1) * cols + (c + 1)];
            const ml = lum[r * cols + (c - 1)];
            const mr = lum[r * cols + (c + 1)];
            const bl = lum[(r + 1) * cols + (c - 1)];
            const bc = lum[(r + 1) * cols + c];
            const br = lum[(r + 1) * cols + (c + 1)];

            const gx = -tl + tr - 2 * ml + 2 * mr - bl + br;
            const gy = -tl - 2 * tc - tr + bl + 2 * bc + br;
            const mag = Math.hypot(gx, gy) / 4.0;

            if (mag > edgeThresh && l > 0.12) {
              const ang = ((Math.atan2(gy, gx) * 180) / Math.PI + 90.0 + 360.0) % 180.0;
              const dir = Math.floor(((ang + 22.5) % 180.0) / 45.0);
              glyph = edgeGlyphs[dir];
            }
          }

          asciiCtx.fillStyle = `rgb(${rArr[idx]},${gArr[idx]},${bArr[idx]})`;
          asciiCtx.fillText(glyph, c * cellW, r * cellH);
        }
      }
    }

    // =========================================================================
    // PĘTLA ANIMACJI I INTERAKCJE UŻYTKOWNIKA
    // =========================================================================
    let lastTimestamp = performance.now();

    function animate(now) {
      const dt = (now - lastTimestamp) / 1000;
      lastTimestamp = now;

      state.time += dt;
      if (state.autoRotate && !state.isDragging && !state.customImage) {
        state.angleY += dt * state.rotateSpeed;
      }

      convertAndDrawASCII();
      requestAnimationFrame(animate);
    }

    // Obsługa przeciągania myszką i dotykiem (obrót 360°)
    const viewportEl = document.getElementById("viewport");

    viewportEl.addEventListener("pointerdown", (e) => {
      state.isDragging = true;
      state.lastPointerX = e.clientX;
      state.lastPointerY = e.clientY;
    });

    window.addEventListener("pointermove", (e) => {
      if (!state.isDragging) return;
      const dx = e.clientX - state.lastPointerX;
      const dy = e.clientY - state.lastPointerY;
      state.lastPointerX = e.clientX;
      state.lastPointerY = e.clientY;

      state.angleY += dx * 0.008;
      state.tiltX = Math.max(-0.45, Math.min(0.55, state.tiltX + dy * 0.005));
    });

    window.addEventListener("pointerup", () => {
      state.isDragging = false;
    });

    // Kontrolki UI
    const toggleRotateBtn = document.getElementById("toggleRotateBtn");
    toggleRotateBtn.addEventListener("click", () => {
      state.autoRotate = !state.autoRotate;
      toggleRotateBtn.textContent = state.autoRotate ? "⏸ Pauza obrotu" : "▶ Wznów obrót";
      toggleRotateBtn.classList.toggle("active", state.autoRotate);
    });

    const speedSlider = document.getElementById("speedSlider");
    const speedVal = document.getElementById("speedVal");
    speedSlider.addEventListener("input", () => {
      state.rotateSpeed = parseFloat(speedSlider.value);
      speedVal.textContent = `${state.rotateSpeed.toFixed(1)}x`;
    });

    const colsSlider = document.getElementById("colsSlider");
    const colsVal = document.getElementById("colsVal");
    colsSlider.addEventListener("input", () => {
      state.cols = parseInt(colsSlider.value, 10);
      colsVal.textContent = state.cols;
    });

    const edgesSlider = document.getElementById("edgesSlider");
    const edgesVal = document.getElementById("edgesVal");
    edgesSlider.addEventListener("input", () => {
      state.edges = parseFloat(edgesSlider.value);
      edgesVal.textContent = state.edges.toFixed(2);
    });

    const satSlider = document.getElementById("satSlider");
    const satVal = document.getElementById("satVal");
    satSlider.addEventListener("input", () => {
      state.saturation = parseFloat(satSlider.value);
      satVal.textContent = state.saturation.toFixed(2);
    });

    const blocksBtn = document.getElementById("blocksBtn");
    blocksBtn.addEventListener("click", () => {
      state.useBlocks = !state.useBlocks;
      blocksBtn.textContent = state.useBlocks ? "▀ Bloki: WŁ" : "▀ Bloki: WYŁ";
      blocksBtn.classList.toggle("active", state.useBlocks);
    });

    // Wgrywanie własnego zdjęcia
    const imageInput = document.getElementById("imageInput");
    const resetBouquetBtn = document.getElementById("resetBouquetBtn");

    imageInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          state.customImage = img;
          resetBouquetBtn.style.display = "inline-flex";
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    resetBouquetBtn.addEventListener("click", () => {
      state.customImage = null;
      imageInput.value = "";
      resetBouquetBtn.style.display = "none";
    });

    // Zapis do PNG
    document.getElementById("savePngBtn").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = "lilie-ascii-3d.png";
      link.href = asciiCanvas.toDataURL("image/png");
      link.click();
    });

    // Start animacji
    requestAnimationFrame(animate);
  </script>
</body>
</html>
