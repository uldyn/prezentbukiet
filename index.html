<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bukiet Lilii ASCII</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #040406;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #asciiCanvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="asciiCanvas"></canvas>

  <script>
    const RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
    const EDGE_GLYPHS = ["-", "\\", "|", "/"];

    const asciiCanvas = document.getElementById("asciiCanvas");
    const asciiCtx = asciiCanvas.getContext("2d");

    const srcCanvas = document.createElement("canvas");
    const srcCtx = srcCanvas.getContext("2d", { willReadFrequently: true });

    let angleY = 0.2;
    let time = 0;

    // Układ kwiatów wzorowany na bukiecie lilii ze zdjęcia:
    // rozłożyste kwiaty po bokach, w środku i u góry + pąki i liście nad wazonem
    const FLOWERS = [
      // Duże kwiaty z przodu i po bokach
      { x: -68, y: 10,  z: 34,  rx: -0.25, ry: -0.45, rz: 0.22,  scale: 1.32, phase: 0.0 },
      { x: 66,  y: 14,  z: 32,  rx: -0.25, ry: 0.45,  rz: -0.20, scale: 1.34, phase: 0.8 },
      { x: -16, y: -6,  z: 46,  rx: -0.18, ry: -0.12, rz: 0.08,  scale: 1.26, phase: 1.6 },
      { x: 22,  y: -18, z: 44,  rx: -0.15, ry: 0.22,  rz: -0.12, scale: 1.22, phase: 2.3 },

      // Środkowa warstwa kwiatów
      { x: -88, y: 34,  z: 4,   rx: -0.35, ry: -0.90, rz: 0.28,  scale: 1.24, phase: 3.0 },
      { x: 86,  y: 36,  z: 2,   rx: -0.35, ry: 0.90,  rz: -0.26, scale: 1.24, phase: 3.7 },
      { x: -30, y: 40,  z: 18,  rx: -0.42, ry: -0.25, rz: 0.12,  scale: 1.26, phase: 4.4 },
      { x: 30,  y: 42,  z: 16,  rx: -0.42, ry: 0.25,  rz: -0.12, scale: 1.26, phase: 5.1 },

      // Górna część bukietu
      { x: -48, y: 66,  z: -10, rx: -0.55, ry: -0.55, rz: 0.18,  scale: 1.18, phase: 0.4 },
      { x: 48,  y: 68,  z: -8,  rx: -0.55, ry: 0.55,  rz: -0.18, scale: 1.18, phase: 1.2 },
      { x: 0,   y: 74,  z: -4,  rx: -0.65, ry: 0.05,  rz: 0.02,  scale: 1.20, phase: 2.0 },

      // Pełny obrót 360° — kwiaty z tyłu
      { x: -64, y: 24,  z: -36, rx: -0.28, ry: -2.20, rz: 0.18,  scale: 1.26, phase: 2.8 },
      { x: 64,  y: 26,  z: -36, rx: -0.28, ry: 2.20,  rz: -0.18, scale: 1.26, phase: 3.5 },
      { x: 0,   y: 38,  z: -46, rx: -0.38, ry: 3.14,  rz: 0.0,   scale: 1.28, phase: 4.2 },
      { x: 0,   y: 8,   z: -42, rx: -0.20, ry: 3.14,  rz: 0.0,   scale: 1.22, phase: 4.9 }
    ];

    const BUDS = [
      { x: 24,  y: 92, z: -6,  tipX: 30,  tipY: 116, tipZ: -4,  phase: 0.4 },
      { x: -32, y: 84, z: -12, tipX: -40, tipY: 106, tipZ: -10, phase: 1.8 },
      { x: 6,   y: 90, z: 8,   tipX: 8,   tipY: 112, tipZ: 12,  phase: 3.2 }
    ];

    const LEAVES = Array.from({ length: 18 }, (_, i) => {
      const a = (i / 18) * Math.PI * 2;
      const r = 22 + (i % 3) * 11;
      return {
        x: Math.cos(a) * r,
        y: -30 + (i % 3) * 14,
        z: Math.sin(a) * r,
        yaw: a,
        len: 48 + (i % 2) * 12,
        wid: 10 + (i % 2) * 2,
        phase: i * 0.55
      };
    });

    function project3D(x, y, z, rotY, cx, cy, scale, charAspect) {
      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      const x1 = x * cosY - z * sinY;
      const z1 = x * sinY + z * cosY;

      const tiltX = 0.12;
      const cosX = Math.cos(tiltX);
      const sinX = Math.sin(tiltX);
      const y2 = y * cosX - z1 * sinX;
      const z2 = y * sinX + z1 * cosX;

      const fov = 440;
      const p = (fov / (fov + z2 + 130)) * scale;

      return {
        x: cx + x1 * p * charAspect,
        y: cy - y2 * p,
        z: z2,
        p
      };
    }

    function localToWorld(lx, ly, lz, fl) {
      let x = lx * Math.cos(fl.rz) - ly * Math.sin(fl.rz);
      let y = lx * Math.sin(fl.rz) + ly * Math.cos(fl.rz);
      let z = lz;

      let y1 = y * Math.cos(fl.rx) - z * Math.sin(fl.rx);
      let z1 = y * Math.sin(fl.rx) + z * Math.cos(fl.rx);
      y = y1;
      z = z1;

      let x2 = x * Math.cos(fl.ry) - z * Math.sin(fl.ry);
      let z2 = x * Math.sin(fl.ry) + z * Math.cos(fl.ry);

      return {
        x: fl.x + x2 * fl.scale,
        y: fl.y + y * fl.scale,
        z: fl.z + z2 * fl.scale
      };
    }

    function boostSaturation(r, g, b, sat) {
      const rn = r / 255, gn = g / 255, bn = b / 255;
      const max = Math.max(rn, gn, bn);
      const min = Math.min(rn, gn, bn);
      const d = max - min;
      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (d !== 0) {
        if (max === rn) h = ((gn - bn) / d + (gn < bn ? 6 : 0)) / 6;
        else if (max === gn) h = ((bn - rn) / d + 2) / 6;
        else h = ((rn - gn) / d + 4) / 6;
      }

      const sNew = Math.min(1, s * sat);
      const i = Math.floor(h * 6);
      const f = h * 6 - i;
      const p = v * (1 - sNew);
      const q = v * (1 - f * sNew);
      const t = v * (1 - (1 - f) * sNew);

      let ro = v, go = v, bo = v;
      switch (i % 6) {
        case 0: ro = v; go = t; bo = p; break;
        case 1: ro = q; go = v; bo = p; break;
        case 2: ro = p; go = v; bo = t; break;
        case 3: ro = p; go = q; bo = v; break;
        case 4: ro = t; go = p; bo = v; break;
        case 5: ro = v; go = p; bo = q; break;
      }
      return [Math.round(ro * 255), Math.round(go * 255), Math.round(bo * 255)];
    }

    function renderBouquet(cols, rows, cellW, cellH) {
      srcCanvas.width = cols;
      srcCanvas.height = rows;

      srcCtx.fillStyle = "#030305";
      srcCtx.fillRect(0, 0, cols, rows);

      const charAspect = cellH / cellW;
      const cx = cols * 0.5;
      const cy = rows * 0.55;
      const scale = Math.min((cols / charAspect) / 275, rows / 245);
      const items = [];

      // Prążkowany wazon rozszerzający się lekko ku górze (jak na zdjęciu lilii)
      const vaseTopY = -44;
      const vaseBotY = -112;
      const radTop = 36;
      const radBot = 24;
      const ribs = 22;

      for (let i = 0; i < ribs; i++) {
        const a1 = (i / ribs) * Math.PI * 2;
        const a2 = ((i + 0.55) / ribs) * Math.PI * 2;

        const t1 = project3D(Math.cos(a1) * radTop, vaseTopY, Math.sin(a1) * radTop, angleY, cx, cy, scale, charAspect);
        const t2 = project3D(Math.cos(a2) * radTop, vaseTopY, Math.sin(a2) * radTop, angleY, cx, cy, scale, charAspect);
        const b2 = project3D(Math.cos(a2) * radBot, vaseBotY, Math.sin(a2) * radBot, angleY, cx, cy, scale, charAspect);
        const b1 = project3D(Math.cos(a1) * radBot, vaseBotY, Math.sin(a1) * radBot, angleY, cx, cy, scale, charAspect);

        const avgZ = (t1.z + t2.z + b1.z + b2.z) * 0.25;
        if (avgZ >= 0) continue;

        items.push({
          z: avgZ + 8,
          draw: () => {
            const spec = Math.abs(Math.sin(a1 + angleY));
            srcCtx.fillStyle = `rgba(140, 175, 162, ${0.22 + spec * 0.25})`;
            srcCtx.beginPath();
            srcCtx.moveTo(t1.x, t1.y);
            srcCtx.lineTo(t2.x, t2.y);
            srcCtx.lineTo(b2.x, b2.y);
            srcCtx.lineTo(b1.x, b1.y);
            srcCtx.closePath();
            srcCtx.fill();

            srcCtx.strokeStyle = `rgba(220, 245, 235, ${0.42 + spec * 0.48})`;
            srcCtx.lineWidth = Math.max(1.0, 1.3 * t1.p);
            srcCtx.beginPath();
            srcCtx.moveTo(t1.x, t1.y);
            srcCtx.lineTo(b1.x, b1.y);
            srcCtx.stroke();
          }
        });
      }

      // Łodygi
      FLOWERS.forEach((fl) => {
        const pTop = project3D(fl.x, fl.y - 4, fl.z, angleY, cx, cy, scale, charAspect);
        const pMid = project3D(fl.x * 0.24, -26, fl.z * 0.24, angleY, cx, cy, scale, charAspect);
        const pBot = project3D(fl.x * 0.14, -102, fl.z * 0.14, angleY, cx, cy, scale, charAspect);

        items.push({
          z: (pTop.z + pMid.z + pBot.z) / 3 + 16,
          draw: () => {
            srcCtx.beginPath();
            srcCtx.moveTo(pBot.x, pBot.y);
            srcCtx.quadraticCurveTo(pMid.x, pMid.y, pTop.x, pTop.y);
            srcCtx.strokeStyle = "#3a6b32";
            srcCtx.lineWidth = Math.max(1.4, 2.2 * pMid.p);
            srcCtx.stroke();
          }
        });
      });

      // Zielone liście
      LEAVES.forEach((lf) => {
        const yaw = lf.yaw + Math.sin(time * 1.3 + lf.phase) * 0.03;
        const pBase = project3D(lf.x, lf.y, lf.z, angleY, cx, cy, scale, charAspect);
        const tx = lf.x + Math.cos(yaw) * lf.len;
        const ty = lf.y + 6;
        const tz = lf.z + Math.sin(yaw) * lf.len;
        const pTip = project3D(tx, ty, tz, angleY, cx, cy, scale, charAspect);

        const px = -Math.sin(yaw) * lf.wid;
        const pz = Math.cos(yaw) * lf.wid;
        const mx = (lf.x + tx) * 0.5;
        const my = (lf.y + ty) * 0.5 + 6;
        const mz = (lf.z + tz) * 0.5;

        const pL = project3D(mx + px, my, mz + pz, angleY, cx, cy, scale, charAspect);
        const pR = project3D(mx - px, my, mz - pz, angleY, cx, cy, scale, charAspect);

        items.push({
          z: (pBase.z + pTip.z + pL.z + pR.z) * 0.25,
          draw: () => {
            srcCtx.beginPath();
            srcCtx.moveTo(pBase.x, pBase.y);
            srcCtx.quadraticCurveTo(pL.x, pL.y, pTip.x, pTip.y);
            srcCtx.quadraticCurveTo(pR.x, pR.y, pBase.x, pBase.y);
            srcCtx.closePath();

            srcCtx.fillStyle = "#2d5926";
            srcCtx.fill();
            srcCtx.strokeStyle = "#48803c";
            srcCtx.lineWidth = Math.max(1.0, 1.2 * pBase.p);
            srcCtx.stroke();
          }
        });
      });

      // Pąki u góry
      BUDS.forEach((bud) => {
        const sway = Math.sin(time * 1.3 + bud.phase) * 2.0;
        const pBase = project3D(bud.x, bud.y - 12, bud.z, angleY, cx, cy, scale, charAspect);
        const pTip = project3D(bud.tipX + sway, bud.tipY, bud.tipZ, angleY, cx, cy, scale, charAspect);
        const pL = project3D(bud.x - 5, bud.y + 4, bud.z + 3, angleY, cx, cy, scale, charAspect);
        const pR = project3D(bud.x + 7, bud.y + 4, bud.z - 3, angleY, cx, cy, scale, charAspect);

        items.push({
          z: pTip.z,
          draw: () => {
            srcCtx.beginPath();
            srcCtx.moveTo(pBase.x, pBase.y);
            srcCtx.quadraticCurveTo(pL.x, pL.y, pTip.x, pTip.y);
            srcCtx.quadraticCurveTo(pR.x, pR.y, pBase.x, pBase.y);
            srcCtx.closePath();

            const grad = srcCtx.createLinearGradient(pBase.x, pBase.y, pTip.x, pTip.y);
            grad.addColorStop(0, "#759946");
            grad.addColorStop(0.45, "#f7a8c2");
            grad.addColorStop(1, "#ffe8f0");
            srcCtx.fillStyle = grad;
            srcCtx.fill();
          }
        });
      });

      // Kwiaty lilii: jasne różowo-białe płatki dające gęstsze znaki ASCII i wyraźny kształt kwiatu
      FLOWERS.forEach((fl) => {
        const sway = Math.sin(time * 1.3 + fl.phase) * 0.025;
        const centerW = localToWorld(0, 0, 0, fl);
        const pCenter = project3D(centerW.x, centerW.y, centerW.z, angleY + sway, cx, cy, scale, charAspect);

        for (let p = 0; p < 6; p++) {
          const theta = (p / 6) * Math.PI * 2 + (p % 2) * 0.05;
          const len = p % 2 === 0 ? 32 : 29;
          const wid = p % 2 === 0 ? 11.5 : 12.5;
          const curl = -8.0;

          const cosT = Math.cos(theta);
          const sinT = Math.sin(theta);

          const wBase = localToWorld(cosT * 2.5, sinT * 2.5, 1, fl);
          const wMidL = localToWorld(
            cosT * (len * 0.52) - sinT * wid,
            sinT * (len * 0.52) + cosT * wid,
            4.2,
            fl
          );
          const wMidR = localToWorld(
            cosT * (len * 0.52) + sinT * wid,
            sinT * (len * 0.52) - cosT * wid,
            4.2,
            fl
          );
          const wTip = localToWorld(cosT * len, sinT * len, curl, fl);
          const wStripe = localToWorld(cosT * (len * 0.72), sinT * (len * 0.72), -1.0, fl);

          const pBase = project3D(wBase.x, wBase.y, wBase.z, angleY + sway, cx, cy, scale, charAspect);
          const pMidL = project3D(wMidL.x, wMidL.y, wMidL.z, angleY + sway, cx, cy, scale, charAspect);
          const pMidR = project3D(wMidR.x, wMidR.y, wMidR.z, angleY + sway, cx, cy, scale, charAspect);
          const pTip = project3D(wTip.x, wTip.y, wTip.z, angleY + sway, cx, cy, scale, charAspect);
          const pStripe = project3D(wStripe.x, wStripe.y, wStripe.z, angleY + sway, cx, cy, scale, charAspect);

          const zAvg = (pBase.z + pMidL.z + pMidR.z + pTip.z) * 0.25;

          items.push({
            z: zAvg,
            draw: () => {
              srcCtx.beginPath();
              srcCtx.moveTo(pBase.x, pBase.y);
              srcCtx.quadraticCurveTo(pMidL.x, pMidL.y, pTip.x, pTip.y);
              srcCtx.quadraticCurveTo(pMidR.x, pMidR.y, pBase.x, pBase.y);
              srcCtx.closePath();

              const grad = srcCtx.createLinearGradient(pBase.x, pBase.y, pTip.x, pTip.y);
              grad.addColorStop(0.0, "#c8d474");
              grad.addColorStop(0.20, "#e63e78");
              grad.addColorStop(0.60, "#ff8eb4");
              grad.addColorStop(0.88, "#ffe4ee");
              grad.addColorStop(1.0, "#ffffff");

              srcCtx.fillStyle = grad;
              srcCtx.fill();

              srcCtx.strokeStyle = "#8a1640";
              srcCtx.lineWidth = Math.max(0.9, 1.2 * pBase.p);
              srcCtx.stroke();

              srcCtx.beginPath();
              srcCtx.moveTo(pBase.x, pBase.y);
              srcCtx.lineTo(pStripe.x, pStripe.y);
              srcCtx.strokeStyle = "#b81d53";
              srcCtx.lineWidth = Math.max(1.0, 1.6 * pBase.p);
              srcCtx.stroke();
            }
          });
        }

        for (let st = 0; st < 6; st++) {
          const a = (st / 6) * Math.PI * 2 + 0.3;
          const wAnther = localToWorld(Math.cos(a) * 10, Math.sin(a) * 10, 14, fl);
          const pAnther = project3D(wAnther.x, wAnther.y, wAnther.z, angleY + sway, cx, cy, scale, charAspect);

          items.push({
            z: pAnther.z - 2,
            draw: () => {
              srcCtx.beginPath();
              srcCtx.moveTo(pCenter.x, pCenter.y);
              srcCtx.lineTo(pAnther.x, pAnther.y);
              srcCtx.strokeStyle = "#e6f0a8";
              srcCtx.lineWidth = Math.max(1.0, 1.2 * pCenter.p);
              srcCtx.stroke();

              srcCtx.fillStyle = "#6e1919";
              srcCtx.beginPath();
              srcCtx.ellipse(
                pAnther.x,
                pAnther.y,
                Math.max(1.6, 2.5 * pAnther.p * charAspect),
                Math.max(1.0, 1.3 * pAnther.p),
                a,
                0,
                Math.PI * 2
              );
              srcCtx.fill();
            }
          });
        }
      });

      items.sort((a, b) => b.z - a.z);
      for (let i = 0; i < items.length; i++) {
        items[i].draw();
      }
    }

    function drawFrame() {
      const vw = Math.max(300, window.innerWidth || document.documentElement.clientWidth || 800);
      const vh = Math.max(300, window.innerHeight || document.documentElement.clientHeight || 600);

      // Gęstsza siatka znaków dla lepszego kształtu płatków i detali
      const targetCols = Math.min(165, Math.max(95, Math.floor(vw / 7)));
      const cellW = Math.max(4, Math.floor(vw / targetCols));
      const cellH = Math.max(7, Math.round(cellW / 0.55));
      const cols = Math.floor(vw / cellW);
      const rows = Math.floor(vh / cellH);

      renderBouquet(cols, rows, cellW, cellH);
      const data = srcCtx.getImageData(0, 0, cols, rows).data;

      const count = cols * rows;
      const rArr = new Uint8Array(count);
      const gArr = new Uint8Array(count);
      const bArr = new Uint8Array(count);
      const lum = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        const p = i * 4;
        const [r, g, b] = boostSaturation(data[p], data[p + 1], data[p + 2], 1.25);
        rArr[i] = r;
        gArr[i] = g;
        bArr[i] = b;
        lum[i] = (0.299 * r + 0.587 * g + 0.114 * b) / 255.0;
      }

      const outW = cols * cellW;
      const outH = rows * cellH;
      if (asciiCanvas.width !== outW || asciiCanvas.height !== outH) {
        asciiCanvas.width = outW;
        asciiCanvas.height = outH;
      }

      asciiCtx.fillStyle = "#040406";
      asciiCtx.fillRect(0, 0, outW, outH);

      asciiCtx.font = `bold ${cellH}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
      asciiCtx.textBaseline = "top";

      const edgeThresh = 0.8 - 0.6 * 0.55;
      const rampLen = RAMP.length;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const idx = r * cols + c;
          const l = lum[idx];
          if (l < 0.06) continue;

          let glyph = RAMP[Math.min(rampLen - 1, Math.round(l * (rampLen - 1)))];

          if (r > 0 && r < rows - 1 && c > 0 && c < cols - 1) {
            const tl = lum[(r - 1) * cols + (c - 1)];
            const tc = lum[(r - 1) * cols + c];
            const tr = lum[(r - 1) * cols + (c + 1)];
            const ml = lum[r * cols + (c - 1)];
            const mr = lum[r * cols + (c + 1)];
            const bl = lum[(r + 1) * cols + (c - 1)];
            const bc = lum[(r + 1) * cols + c];
            const br = lum[(r + 1) * cols + (c + 1)];

            const gx = -tl + tr - 2 * ml + 2 * mr - bl + br;
            const gy = -tl - 2 * tc - tr + bl + 2 * bc + br;
            const mag = Math.hypot(gx, gy) / 4.0;

            if (mag > edgeThresh && l > 0.12) {
              const ang = ((Math.atan2(gy, gx) * 180) / Math.PI + 90.0 + 360.0) % 180.0;
              glyph = EDGE_GLYPHS[Math.floor(((ang + 22.5) % 180.0) / 45.0)];
            }
          }

          asciiCtx.fillStyle = `rgb(${rArr[idx]},${gArr[idx]},${bArr[idx]})`;
          asciiCtx.fillText(glyph, c * cellW, r * cellH);
        }
      }
    }

    let prev = performance.now();
    function loop(now) {
      const dt = Math.min(0.1, (now - prev) / 1000);
      prev = now;
      time += dt;
      angleY += dt * 0.55;
      drawFrame();
      requestAnimationFrame(loop);
    }

    drawFrame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
